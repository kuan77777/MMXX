<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>角色创建 — DEAD WORLD</title>
  <link rel="stylesheet" href="game/ui/ui.css">
  <script type="importmap">
    { "imports": { "three": "./js/fw3d/vendor/three.module.min.js", "three/addons/": "./js/fw3d/vendor/addons/" } }
  </script>
  <style>
    html, body { margin: 0; height: 100%; background: #0e1318; overflow: hidden; font-family: ui-monospace, monospace; }
    #cv { position: fixed; inset: 0; display: block; }
    #panel {
      position: fixed; right: 0; top: 0; bottom: 0; width: 380px; overflow-y: auto;
      background: rgba(14, 19, 24, .92); border-left: 1px solid rgba(150,175,190,.22);
      color: #d9e2e8; padding: 18px 20px 28px; box-sizing: border-box;
    }
    #panel h1 { font-size: 15px; letter-spacing: .18em; margin: 0 0 4px; color: #e0a34a; }
    #panel .sub { font-size: 11px; color: #8fa0ac; margin-bottom: 18px; line-height: 1.6; }
    .sec { font-size: 10px; letter-spacing: .14em; color: #8fa0ac; text-transform: uppercase; margin: 18px 0 8px; }
    .teams { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .team {
      display: flex; align-items: center; gap: 6px; padding: 6px 8px; cursor: pointer;
      background: rgba(255,255,255,.04); border: 1px solid rgba(150,175,190,.22); border-radius: 5px;
      font-size: 11px; color: #d9e2e8; text-align: left;
    }
    .team:hover { background: rgba(224,163,74,.14); }
    .team.on { border-color: #e0a34a; background: rgba(224,163,74,.18); }
    .sw { width: 12px; height: 12px; border-radius: 2px; border: 1px solid rgba(255,255,255,.25); flex: 0 0 auto; }
    .row { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip { width: 26px; height: 26px; border-radius: 4px; border: 1px solid rgba(150,175,190,.35); cursor: pointer; }
    .chip.on { outline: 2px solid #e0a34a; outline-offset: 1px; }
    .seg { display: flex; gap: 6px; }
    .seg button {
      flex: 1; padding: 7px; font: inherit; font-size: 11px; cursor: pointer; color: #d9e2e8;
      background: rgba(255,255,255,.05); border: 1px solid rgba(150,175,190,.22); border-radius: 5px;
    }
    .seg button.on { border-color: #e0a34a; background: rgba(224,163,74,.18); }
    input[type=text], input[type=number] {
      width: 100%; box-sizing: border-box; padding: 7px 9px; font: inherit; font-size: 12px;
      color: #d9e2e8; background: rgba(255,255,255,.06); border: 1px solid rgba(150,175,190,.22); border-radius: 5px;
    }
    .actions { display: flex; gap: 8px; margin-top: 22px; }
    .actions button {
      flex: 1; padding: 10px; font: inherit; font-size: 12px; cursor: pointer; border-radius: 5px;
      color: #ffe6bd; background: rgba(224,163,74,.2); border: 1px solid rgba(224,163,74,.6);
    }
    .actions button.ghost { color: #d9e2e8; background: rgba(255,255,255,.05); border-color: rgba(150,175,190,.25); }
    #out { margin-top: 14px; font-size: 10px; line-height: 1.6; color: #8fa0ac; white-space: pre-wrap; }
    #hint { position: fixed; left: 18px; top: 16px; color: #8fa0ac; font-size: 11px; line-height: 1.7; }
    #hint b { color: #e0a34a; }
  </style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hint">
  <b>角色创建</b><br>
  拖动旋转 · 滚轮缩放<br>
  <span id="who"></span>
</div>
<div id="panel">
  <h1>角色创建</h1>
  <div class="sub">选一支球队（决定球衣主色、队徽、商标、胸前字），再调外观与姓名。数据来自现有足球库与球衣包。</div>

  <div class="sec">球队（中超 16 队）</div>
  <div class="teams" id="teams"></div>

  <div class="sec">性别 / 体型</div>
  <div class="seg" id="gender">
    <button data-g="male" class="on">男性</button>
    <button data-g="female">女性</button>
  </div>

  <div class="sec">体型模板（12 款：身高/体格/发型/胡子）<a href="male-templates.html" target="_blank" style="float:right;color:#8fa0ac;font-size:10px">全部模板 ↗</a></div>
  <div class="seg" id="templates" style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px"></div>

  <div class="sec">肤色</div>
  <div class="row" id="skins"></div>

  <div class="sec">发色</div>
  <div class="row" id="hairs"></div>

  <div class="sec">发型</div>
  <div class="seg" id="hairStyles" style="flex-wrap:wrap"></div>

  <div class="sec">胡子</div>
  <div class="seg" id="beards" style="flex-wrap:wrap"></div>

  <div class="sec">号码（1–99）</div>
  <input type="number" id="number" min="1" max="99" value="7">

  <div class="sec">姓名（印在背号上方）</div>
  <input type="text" id="name" maxlength="14" value="幸存者" placeholder="输入姓名">

  <div class="actions">
    <button id="save">保存角色</button>
    <button id="random" class="ghost">随机</button>
  </div>
  <div id="out"></div>
</div>

<script type="module">
import * as THREE from 'three';
import { CSL_KITS, CSL_BY_SLUG } from './game/appearance/csl-kits.js';
import { buildKitAtlas } from './game/appearance/kit-atlas.js';
import { applyKitTexture } from './game/appearance/shirt-uv.js';
import { makeKit } from './game/appearance/kit.js';
import { AssetLoader } from './game/assets/loader.js';
import { CharacterFactory } from './game/characters/fbx.js';
import { CHARACTER_MODELS } from './game/assets/manifest.js';
import { SKIN_TONES, HAIR_COLORS } from './js/fw3d/players/appearance.js';
import { MALE_TEMPLATES, HAIR_STYLES, BEARD_STYLES, applyMaleTemplate, describeStats } from './game/characters/male-templates.js';

const SAVE_KEY = 'dd.character.v1';
const state = {
  team: new URLSearchParams(location.search).get('team') || 'shanghai_port',
  gender: 'male',
  template: 'standard',
  skin: SKIN_TONES[Math.floor(SKIN_TONES.length / 2)].hex,
  hair: HAIR_COLORS[0].hex,
  hairStyle: 'short',
  beard: 'none',
  number: Math.max(1, Math.min(99, Number(new URLSearchParams(location.search).get('number')) || 7)),
  name: (new URLSearchParams(location.search).get('name') || '幸存者').slice(0, 14),
};

// 发型 / 胡子来自 characters/male-templates.js —— 和游戏里 NPC 用的是**同一套**库
// （库里 8 种发型、6 种胡子，都是长在头骨局部空间里的低多边形几何/贴脸壳）。
const HAIR_STYLE_DEFS = HAIR_STYLES.map((s) => ({ key: s.key, label: s.label }));
const BEARD_DEFS = BEARD_STYLES.map((s) => ({ key: s.key, label: s.label }));

// ── 3D 场景
const canvas = document.getElementById('cv');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a2028);
const cam = new THREE.PerspectiveCamera(38, (innerWidth - 380) / innerHeight, 0.05, 60);
scene.add(new THREE.HemisphereLight(0xdfe8f0, 0x3c463a, 1.25));
const sun = new THREE.DirectionalLight(0xfff0d0, 1.9);
sun.position.set(3, 7, 6); sun.castShadow = true; scene.add(sun);
const ground = new THREE.Mesh(new THREE.CircleGeometry(6, 32), new THREE.MeshLambertMaterial({ color: 0x333c38 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

let orbit = { yaw: -0.45, dist: 3.1, drag: false, px: 0 };
let factory = null, current = null, currentAtlas = null;

function disposeCurrent() {
  if (!current) return;
  scene.remove(current.group);
  if (currentAtlas && currentAtlas.texture) currentAtlas.texture.dispose?.();
  current = null;
}

// 模板预览用：把所选模板套到已经建好的模型上（体型/身高/发型/胡子一次到位）
function applyTemplate(model) {
  const tpl = MALE_TEMPLATES.find((t) => t.id === state.template) || MALE_TEMPLATES[0];
  const isFemale = state.gender === 'female';
  // 女性模型归一化到 1.70m，身高按同一比例缩放模板
  const def = {
    ...tpl,
    id: `${tpl.id}${isFemale ? ':f' : ''}`,
    height: isFemale ? tpl.height * (1.70 / 1.78) : tpl.height,
    skin: state.skin,
    hair: { style: state.hairStyle, color: state.hair },
    beard: { style: state.beard, color: state.hair },
  };
  return applyMaleTemplate(THREE, model, def);
}

// 发型/胡子/体型/身高全部交给 characters/male-templates.js：
// 几何长在头骨局部空间里（会跟着低头/转头动），体型靠骨骼缩放，不再把盒子钉在世界坐标上。
let lastApplied = null;
const tplName = (id) => (MALE_TEMPLATES.find((t) => t.id === id) || {}).name || id;

function rebuild() {
  if (!factory) return;
  disposeCurrent();
  const tpl0 = MALE_TEMPLATES.find((t) => t.id === state.template) || MALE_TEMPLATES[0];
  const key = state.gender === 'female' ? 'female_casual' : (tpl0.base || 'male_shirt');
  if (!factory.canUse(key)) { out.textContent = '角色模板不可用：' + key; return; }
  const model = factory.create(key);
  lastApplied = applyTemplate(model);

  const team = CSL_BY_SLUG.get(state.team) || CSL_KITS[0];
  const kit = makeKit({
    clubId: team.clubId,
    playerId: 'custom_' + state.team + '_' + state.number,
    primary: team.color,
    secondary: team.secondary,
    number: state.number,
    name: state.name,
  });
  const atlas = buildKitAtlas({ front: null, kit, size: 512 });
  const res = applyKitTexture(THREE, model, atlas.canvas);
  currentAtlas = atlas;
  current = model;
  scene.add(model.group);
  if (model.clips.idle) {
    model.mixer = new THREE.AnimationMixer(model.group);
    model.mixer.clipAction(model.clips.idle).play();
  }
  const r = lastApplied && lastApplied.report;
  document.getElementById('who').textContent =
    `${team.teamZh} · ${state.gender === 'male' ? '男' : '女'} · ${state.number} 号 · ${state.name}` +
    (res.ok ? '' : `  ⚠ ${res.reason}`);
  out.textContent = [
    '球衣：' + (res.ok ? '已套用（纯色 + 队徽 + 商标 + 胸前字 + 背号/姓名）' : '未套用：' + res.reason),
    r ? `模板：${tplName(state.template)} · ${r.height.toFixed(2)}m · 肩宽 ${r.worldFactors.chest[0]}× · 腰 ${r.worldFactors.spine[0]}× · 头 ${r.worldFactors.head[0]}×` : '',
    r ? `发型 ${r.hair}（${r.hairBoxes} 块）· 胡子 ${r.beard}（${r.beardTris} 面壳 + ${r.beardBoxes} 块）` : '',
    r && r.stats ? `属性：血 ${Math.round(100 * r.stats.health)} · 速 ${r.stats.speed}× · 负重 ${r.stats.carry}× · 近战 ${r.stats.melee}× · 压枪 ${r.stats.recoil}×\n` +
      `      ${describeStats(r.stats)}（受击面积 ${r.stats.area}×）` : '',
  ].filter(Boolean).join('\n');
}

// ── UI
const teamsEl = document.getElementById('teams');
CSL_KITS.forEach((t) => {
  const b = document.createElement('button');
  b.className = 'team' + (t.slug === state.team ? ' on' : '');
  b.dataset.slug = t.slug;
  b.innerHTML = `<span class="sw" style="background:${t.color}"></span><span>${t.teamZh}</span>`;
  b.onclick = () => {
    state.team = t.slug;
    [...teamsEl.children].forEach((x) => x.classList.toggle('on', x.dataset.slug === t.slug));
    rebuild();
  };
  teamsEl.appendChild(b);
});

const skinsEl = document.getElementById('skins');
SKIN_TONES.forEach((t) => {
  const c = document.createElement('div');
  c.className = 'chip' + (t.hex === state.skin ? ' on' : '');
  c.style.background = '#' + t.hex.toString(16).padStart(6, '0');
  c.onclick = () => {
    state.skin = t.hex;
    [...skinsEl.children].forEach((x) => x.classList.toggle('on', x === c));
    rebuild();
  };
  skinsEl.appendChild(c);
});

const hairsEl = document.getElementById('hairs');
HAIR_COLORS.slice(0, 10).forEach((t) => {
  const c = document.createElement('div');
  c.className = 'chip' + (t.hex === state.hair ? ' on' : '');
  c.style.background = '#' + t.hex.toString(16).padStart(6, '0');
  c.onclick = () => {
    state.hair = t.hex;
    [...hairsEl.children].forEach((x) => x.classList.toggle('on', x === c));
    rebuild();
  };
  hairsEl.appendChild(c);
});

// 发型 / 胡子按钮
const hsEl = document.getElementById('hairStyles');
HAIR_STYLE_DEFS.forEach((d) => {
  const b = document.createElement('button');
  b.textContent = d.label;
  b.className = state.hairStyle === d.key ? 'on' : '';
  b.dataset.k = d.key;
  b.onclick = () => {
    state.hairStyle = d.key;
    [...hsEl.children].forEach((x) => x.classList.toggle('on', x === b));
    rebuild();
  };
  hsEl.appendChild(b);
});
const bdEl = document.getElementById('beards');
BEARD_DEFS.forEach((d) => {
  const b = document.createElement('button');
  b.textContent = d.label;
  b.className = state.beard === d.key ? 'on' : '';
  b.dataset.k = d.key;
  b.onclick = () => {
    state.beard = d.key;
    [...bdEl.children].forEach((x) => x.classList.toggle('on', x === b));
    rebuild();
  };
  bdEl.appendChild(b);
});

// ── 体型模板
const tplEl = document.getElementById('templates');
MALE_TEMPLATES.forEach((t) => {
  const b = document.createElement('button');
  b.textContent = t.name;
  b.className = state.template === t.id ? 'on' : '';
  b.dataset.k = t.id;
  b.title = `${t.height.toFixed(2)}m · ${t.hair.style} / ${t.beard.style}`;
  b.onclick = () => {
    state.template = t.id;
    // 换模板 = 换一套身材 + 一头一脸：把模板的发型/胡子/肤色/发色也带进控件，用户还能再改
    state.hairStyle = t.hair.style;
    state.beard = t.beard.style;
    state.hair = t.hair.color;
    const nearSkin = SKIN_TONES.reduce((a, c) => (Math.abs(c.hex - t.skin) < Math.abs(a.hex - t.skin) ? c : a), SKIN_TONES[0]);
    state.skin = nearSkin.hex;
    syncUi();
    rebuild();
  };
  tplEl.appendChild(b);
});

/** 把 state 重新刷到所有控件的高亮上（换模板/随机时用）。 */
function syncUi() {
  [...tplEl.children].forEach((x) => x.classList.toggle('on', x.dataset.k === state.template));
  [...hsEl.children].forEach((x) => x.classList.toggle('on', x.dataset.k === state.hairStyle));
  [...bdEl.children].forEach((x) => x.classList.toggle('on', x.dataset.k === state.beard));
  [...skinsEl.children].forEach((x, i) => x.classList.toggle('on', SKIN_TONES[i] && SKIN_TONES[i].hex === state.skin));
  [...hairsEl.children].forEach((x, i) => x.classList.toggle('on', HAIR_COLORS[i] && HAIR_COLORS[i].hex === state.hair));
  [...document.querySelectorAll('#gender button')].forEach((x) => x.classList.toggle('on', x.dataset.g === state.gender));
  [...teamsEl.children].forEach((x) => x.classList.toggle('on', x.dataset.slug === state.team));
}

document.getElementById('gender').onclick = (e) => {  const b = e.target.closest('button[data-g]');
  if (!b) return;
  state.gender = b.dataset.g;
  [...document.querySelectorAll('#gender button')].forEach((x) => x.classList.toggle('on', x === b));
  rebuild();
};
document.getElementById('number').oninput = (e) => {
  state.number = Math.max(1, Math.min(99, Number(e.target.value) || 1));
  rebuild();
};
document.getElementById('name').oninput = (e) => {
  state.name = e.target.value.trim().slice(0, 14) || '幸存者';
  rebuild();
};
document.getElementById('random').onclick = () => {
  const t = MALE_TEMPLATES[Math.floor(Math.random() * MALE_TEMPLATES.length)];
  state.template = t.id;
  state.hairStyle = t.hair.style;
  state.beard = t.beard.style;
  state.hair = t.hair.color;
  state.team = CSL_KITS[Math.floor(Math.random() * CSL_KITS.length)].slug;
  state.skin = SKIN_TONES[Math.floor(Math.random() * SKIN_TONES.length)].hex;
  state.number = 1 + Math.floor(Math.random() * 40);
  document.getElementById('number').value = state.number;
  syncUi();
  rebuild();
};
document.getElementById('save').onclick = () => {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(state));
    out.textContent = '已保存到浏览器：\n' + JSON.stringify(state);
    window.__CREATED__ = state;
  } catch (e) { out.textContent = '保存失败：' + (e && e.message); }
};

// ── 交互：拖动旋转 / 滚轮缩放
canvas.addEventListener('pointerdown', (e) => { orbit.drag = true; orbit.px = e.clientX; });
addEventListener('pointerup', () => { orbit.drag = false; });
addEventListener('pointermove', (e) => {
  if (!orbit.drag) return;
  orbit.yaw -= (e.clientX - orbit.px) * 0.01;
  orbit.px = e.clientX;
});
canvas.addEventListener('wheel', (e) => {
  orbit.dist = Math.max(1.8, Math.min(6, orbit.dist + Math.sign(e.deltaY) * 0.25));
}, { passive: true });

addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  cam.aspect = (innerWidth - 380) / innerHeight;
  cam.updateProjectionMatrix();
});

// ── 启动
const out = document.getElementById('out');
try {
  const saved = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
  if (saved && saved.team) Object.assign(state, saved);
  document.getElementById('number').value = state.number;
  document.getElementById('name').value = state.name;
  syncUi();

  const loader = new AssetLoader(THREE, { base: '' });
  factory = new CharacterFactory(THREE, loader, CHARACTER_MODELS);
  await factory.preload();
  rebuild();
  document.title = 'CREATOR-READY';
} catch (e) {
  out.textContent = '初始化失败：' + (e && e.stack ? e.stack : e);
  document.title = 'CREATOR-FAIL';
}

let t = 0;
function loop() {
  requestAnimationFrame(loop);
  const dt = 1 / 60; t += dt;
  if (current && current.mixer) current.mixer.update(dt);
  if (current) current.group.rotation.y = orbit.yaw;
  cam.position.set(Math.sin(0.35) * orbit.dist * 0.55, 1.35, orbit.dist);
  cam.lookAt(0, 0.98, 0);
  renderer.render(scene, cam);
}
loop();
window.__CREATOR__ = { state, rebuild, get current() { return current; } };
</script>
</body>
</html>
